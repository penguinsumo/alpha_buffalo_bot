name: Python CI
on:
  push:
    branches: ["v12-core", "main"]
  pull_request:
    branches: ["v12-core", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m py_compile
          alpha_buffalo_signal.py decision_engine.py early_warning.py
          execution_lifecycle.py harmonic_detector.py kivanc_vsaob.py
          pine_signal_bridge.py scenario_blueprint.py scenario_scanner.py
          session_clock.py signal_composer.py signal_schema.py
          telegram_bot.py telegram_guard.py engine_v4/*.py runtime_layers/*.py
          scripts/regression_cases/*.py
      - run: python scripts/alpha_regression_suite.py
      - run: python scripts/test_python_execution_roundtrip.py
      - run: python scripts/test_pine_webhook_roundtrip.py
      - run: python scripts/test_pine_ea_bridge.py
      - run: python scripts/test_harmonic_webhook_gate.py
      - run: python scripts/test_harmonic_projection_bias.py
      - run: python scripts/test_harmonic_newday_route.py
      - run: python scripts/check_pine_v2_4.py
