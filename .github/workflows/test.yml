name: test
on:
  push:
    branches: ["v12-core", "main"]
  pull_request:
    branches: ["v12-core", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile alpha_buffalo_signal.py scenario_blueprint.py scenario_scanner.py decision_engine.py signal_composer.py session_clock.py
